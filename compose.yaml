services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data/m
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TRIAGE_MODEL: ${GEMINI_TRIAGE_MODEL:-gemini-3.5-flash-lite}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    restart: unless-stopped
