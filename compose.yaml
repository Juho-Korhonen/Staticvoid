services:
  db:
    image: mariadb:11.4
    # Committing once a second instead of per transaction makes the first load much faster.
    command: --max-allowed-packet=64M --innodb-flush-log-at-trx-commit=2
    environment:
      MARIADB_DATABASE: wiki
      MARIADB_USER: wiki
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 24
    restart: unless-stopped

  # Fills the system-versioned table from data/m on the first start; a no-op afterwards.
  loader:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "server.load_mariadb"]
    environment:
      MARIADB_HOST: db
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MARIADB_HOST: db
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TRIAGE_MODEL: ${GEMINI_TRIAGE_MODEL:-gemini-decision-1}
    depends_on:
      loader:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    restart: unless-stopped

volumes:
  db:
